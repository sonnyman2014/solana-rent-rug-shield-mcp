[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-rug-shield"
version = "1.0.0"
description = "Sub 120ms 10 Layer Solana Token Safety Gate, Layer 9 Inner CPI Drainer Simulator, and Unclaimed ATA Rent Scanner with Solana x402 Auto Pay (Python SDK and MCP Stdio Server)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Rent and Rug Shield", email = "security@rentandrugshield.com"}
]
keywords = [
  "solana",
  "mcp",
  "x402",
  "rug-shield",
  "token-2022",
  "security",
  "defi",
  "ata-rent"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
solana = [
  "solders>=0.20.0",
  "base58>=2.1.0",
  "cryptography>=41.0.0"
]
async = [
  "httpx>=0.25.0",
  "aiohttp>=3.9.0"
]
dev = [
  "pytest>=7.0.0"
]
all = [
  "solders>=0.20.0",
  "base58>=2.1.0",
  "cryptography>=41.0.0",
  "httpx>=0.25.0",
  "aiohttp>=3.9.0"
]

[project.urls]
Homepage = "https://rentandrugshield.com"
Documentation = "https://rentandrugshield.com"
Repository = "https://github.com/sonnyman2014/solana-rent-rug-shield-mcp"

[project.scripts]
solana-rug-shield = "solana_rug_shield.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
